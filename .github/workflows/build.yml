# Media Forge — build & publish pipeline
#
#  • Every push / PR to main:   builds the NSIS installer (and the Store .appx when
#                               the STORE_IDENTITY_* secrets exist) and uploads them
#                               as workflow artifacts.
#  • Tag v1.2.0 (or "Run workflow" with publish=true): additionally creates a GitHub
#                               Release with the installer and SUBMITS the .appx to the
#                               Microsoft Store through the Microsoft Store CLI.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   STORE_IDENTITY_NAME            Partner Center → Product identity → Package/Identity/Name
#   STORE_PUBLISHER                … → Package/Identity/Publisher   (CN=xxxxxxxx-…)
#   STORE_PUBLISHER_DISPLAY_NAME   … → Package/Properties/PublisherDisplayName
#   STORE_APP_ID                   Partner Center → Product identity → Store ID (9Nxxxxxxxxxx)
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, STORE_SELLER_ID
#                                  Partner Center → Account settings → User management →
#                                  Azure AD applications (see store/SUBMISSION-CHECKLIST.md §9)
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Submit the Store package to Partner Center
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      STORE_IDENTITY_NAME: ${{ secrets.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ secrets.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.STORE_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: ver
        shell: pwsh
        run: '"version=$((Get-Content package.json | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT'

      - name: Cache FFmpeg and prerequisites
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/fetch-ffmpeg.js', 'scripts/fetch-vcredist.js') }}-${{ github.run_number }}
          restore-keys: vendor-${{ hashFiles('scripts/fetch-ffmpeg.js', 'scripts/fetch-vcredist.js') }}-

      - name: Fetch FFmpeg and VC++ runtime
        run: |
          npm run fetch-ffmpeg
          npm run fetch-vcredist

      - name: Package app (electron-builder)
        run: npm run pack

      - name: Build NSIS installer
        run: npm run installer

      - name: Write Store identity
        if: env.STORE_IDENTITY_NAME != ''
        shell: pwsh
        run: |
          @{
            identityName         = $env:STORE_IDENTITY_NAME
            publisher            = $env:STORE_PUBLISHER
            publisherDisplayName = $env:STORE_PUBLISHER_DISPLAY_NAME
          } | ConvertTo-Json | Set-Content store.identity.json -Encoding utf8

      - name: Build Microsoft Store package (.appx)
        if: env.STORE_IDENTITY_NAME != ''
        run: npm run store

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-Setup-${{ steps.ver.outputs.version }}
          path: dist/MediaForge-Setup-*.exe
          if-no-files-found: error

      - name: Upload Store package artifact
        if: env.STORE_IDENTITY_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-Store-${{ steps.ver.outputs.version }}
          path: dist-store/*.appx
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MediaForge-Setup-*.exe
            dist-store/*.appx
          generate_release_notes: true

      # ---------------- Microsoft Store submission ----------------
      - name: Set up Microsoft Store CLI
        if: env.STORE_IDENTITY_NAME != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
        uses: microsoft/setup-msstore-cli@v1

      - name: Configure Store CLI credentials
        if: env.STORE_IDENTITY_NAME != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
        run: msstore reconfigure --tenantId ${{ secrets.AZURE_TENANT_ID }} --sellerId ${{ secrets.STORE_SELLER_ID }} --clientId ${{ secrets.AZURE_CLIENT_ID }} --clientSecret ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Submit to Microsoft Store
        if: env.STORE_IDENTITY_NAME != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
        shell: pwsh
        run: |
          $pkg = Get-ChildItem dist-store/*.appx | Select-Object -First 1
          Write-Host "Submitting $($pkg.Name) to Store app ${{ secrets.STORE_APP_ID }}"
          msstore publish --appId ${{ secrets.STORE_APP_ID }} --inputFile "$($pkg.FullName)" --verbose
