# Media Forge — build & publish pipeline
#
#  • Every push / PR to main:   builds the NSIS installer and the Store .appx and
#                               uploads them as workflow artifacts.
#  • Tag v1.2.0 (or "Run workflow" with publish=true): additionally creates a GitHub
#                               Release with the installer and SUBMITS the .appx to the
#                               Microsoft Store through the Microsoft Store CLI.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
#                                  Partner Center → Account settings → User management →
#                                  Azure AD applications (see store/SUBMISSION-CHECKLIST.md §9)
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Submit the Store package to Partner Center
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      STORE_APP_ID: 9N6XGL7KL5M7
      STORE_SELLER_ID: '97237770'
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: ver
        shell: pwsh
        run: '"version=$((Get-Content package.json | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT'

      - name: Cache FFmpeg and prerequisites
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/fetch-ffmpeg.js', 'scripts/fetch-vcredist.js') }}-${{ github.run_number }}
          restore-keys: vendor-${{ hashFiles('scripts/fetch-ffmpeg.js', 'scripts/fetch-vcredist.js') }}-

      - name: Fetch FFmpeg and VC++ runtime
        run: |
          npm run fetch-ffmpeg
          npm run fetch-vcredist

      - name: Package app (electron-builder)
        run: npm run pack

      - name: Build NSIS installer
        run: npm run installer

      - name: Build Microsoft Store package (.appx)
        run: npm run store

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-Setup-${{ steps.ver.outputs.version }}
          path: dist/MediaForge-Setup-*.exe
          if-no-files-found: error

      - name: Upload Store package artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-Store-${{ steps.ver.outputs.version }}
          path: dist-store/*.appx
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MediaForge-Setup-*.exe
            dist-store/*.appx
            store/media-forge-store-kit.zip
          generate_release_notes: true

      # ---------------- Microsoft Store submission ----------------
      - name: Set up Microsoft Store CLI
        if: env.AZURE_TENANT_ID != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
        uses: microsoft/setup-msstore-cli@v1

      - name: Configure Store CLI credentials
        if: env.AZURE_TENANT_ID != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
        run: msstore reconfigure --tenantId ${{ secrets.AZURE_TENANT_ID }} --sellerId ${{ env.STORE_SELLER_ID }} --clientId ${{ secrets.AZURE_CLIENT_ID }} --clientSecret ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Submit to Microsoft Store
        if: env.AZURE_TENANT_ID != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
        shell: pwsh
        run: |
          $pkg = Get-ChildItem dist-store/*.appx | Select-Object -First 1
          Write-Host "Submitting $($pkg.Name) to Store app ${{ env.STORE_APP_ID }}"
          msstore publish --appId ${{ env.STORE_APP_ID }} --inputFile "$($pkg.FullName)" --verbose
